<!doctype html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="スマホで始めるサイバー宝探し。登録不要の８問に、無料ヒントと解説を用意。暗号・画像・証拠からフラグを探そう。"
    />
    <title>CYBER FIRST STEP — スマホでサイバー宝探し</title>
    <link
      rel="icon"
      href="/assets/cyber-first-step-icon-green.png"
      type="image/png"
      sizes="128x128"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/header.js" defer></script>
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ移動</a>
    <header class="site-header">
      <a class="brand" href="#home" aria-label="CYBER FIRST STEP ホーム"
        ><img
          class="brand-logo"
          src="/assets/cyber-first-step-icon-green.png"
          width="128"
          height="128"
          alt=""
        /><span class="brand-wordmark">CYBER<span class="brand-sub">FIRST STEP</span></span></a
      >
      <nav aria-label="メイン">
        <a href="#missions">８つのミッション</a><a href="#about">この体験について</a
        ><a class="header-result" href="#result">進捗 <span id="header-score">0 / 8</span></a>
      </nav>
    </header>
    <main id="main" tabindex="-1">
      <div class="initial-loading" role="status">ミッションを準備しています…</div>
    </main>
    <footer class="site-footer">
      <a class="footer-brand" href="#home">CYBER FIRST STEP</a>
      <p>防衛省サイバーコンテストの体験サイト。<br />学生企画・非公式です。</p>
      <a href="#about">利用について・参考資料</a>
    </footer>
    <dialog id="image-dialog" aria-label="調査画像を拡大">
      <div class="dialog-header">
        <span>画像を調査する</span
        ><button id="close-image" class="icon-btn" aria-label="画像を閉じる">×</button>
      </div>
      <p>拡大ボタンで大きく表示。画像は上下左右にスクロールできます。</p>
      <div class="zoom-controls">
        <button id="zoom-out" class="btn small">− 縮小</button><output id="zoom-label">100%</output
        ><button id="zoom-in" class="btn small">＋ 拡大</button>
      </div>
      <div id="image-scroll"><img id="zoom-image" alt="" /></div>
    </dialog>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <h2 id="confirm-title">解説を見ますか？</h2>
      <p id="confirm-description"></p>
      <div class="dialog-actions">
        <button id="confirm-cancel" class="btn">戻る</button
        ><button id="confirm-ok" class="btn primary">解説を見る</button>
      </div>
    </dialog>
    <noscript
      >このCTFではJavaScriptを使用します。ブラウザのJavaScriptを有効にしてください。大会情報は
      https://www.mod.go.jp/j/approach/defense/cyber/c_contest/ から確認できます。</noscript
    >
  </body>
</html>
